<!doctype html>
<html lang="en" class="min-h-full bg-[#080d18]">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <meta name="description" content="A minimal single-user PWA starter">
    <title>PWA Starter</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body class="min-h-dvh min-w-80 bg-[#080d18] text-slate-50 antialiased">
    <main id="loading-view" class="grid min-h-dvh place-items-center p-6 text-center" aria-live="polite">
      <div>
        <div class="mx-auto h-8 w-8 animate-spin rounded-full border-[3px] border-slate-400/20 border-t-indigo-400 motion-reduce:animate-none" aria-hidden="true"></div>
        <p class="mt-3 text-slate-400">Loading…</p>
      </div>
    </main>

    <main id="login-view" class="grid min-h-dvh place-items-center pt-[max(1.5rem,env(safe-area-inset-top))] pr-[max(1rem,env(safe-area-inset-right))] pb-[max(1.5rem,env(safe-area-inset-bottom))] pl-[max(1rem,env(safe-area-inset-left))] text-center" hidden>
      <form id="login-form" class="w-full max-w-xs">
        <label for="password" class="sr-only">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required class="min-h-12 w-full rounded-lg border border-slate-700 bg-slate-900 px-4 text-slate-50 outline-none focus:border-indigo-400">
        <p id="login-error" class="mt-3 text-sm text-red-300" role="alert" hidden></p>
        <button id="login-button" class="mt-3 min-h-12 w-full touch-manipulation rounded-lg bg-indigo-600 px-4 font-semibold text-white hover:bg-indigo-700 disabled:opacity-60" type="submit">Sign in</button>
      </form>
    </main>

    <main id="app-view" class="min-h-dvh p-4" hidden>
      <button id="logout-button" class="min-h-11 rounded-lg bg-slate-800 px-4 text-sm font-semibold hover:bg-slate-700" type="button">Sign out</button>
    </main>
  </body>
</html>
