Include /config/domain.conf

<VirtualHost *:80>
    ServerName ${APP_DOMAIN}
    Redirect permanent / https://${APP_DOMAIN}/
</VirtualHost>

<VirtualHost *:443>
    ServerName ${APP_DOMAIN}

    SSLEngine on
    SSLCertificateFile /config/certs/server.crt
    SSLCertificateKeyFile /config/certs/server.key

    ProxyRequests off
    ProxyPreserveHost off
    ProxyPass / http://pwa-starter:3000/ connectiontimeout=5 timeout=30
    ProxyPassReverse / http://pwa-starter:3000/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
</VirtualHost>
